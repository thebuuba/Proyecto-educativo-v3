name: Revisión aislada de configuración

on:
  push:
    branches: [fix/configuracion-sin-hardcoding]
    paths:
      - .automation/hardcoding.patch
      - .github/workflows/revision-hardcoding-temporal.yml

permissions:
  contents: write

concurrency:
  group: revision-hardcoding-aislada
  cancel-in-progress: false

jobs:
  revision:
    if: github.ref == 'refs/heads/fix/configuracion-sin-hardcoding'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Verifica la base solicitada
        run: git merge-base --is-ancestor 891ccca847fa6f0b9ee1d03a7bcd89fd37c63254 HEAD
      - name: Aplica correcciones exclusivamente en esta rama
        id: patch
        shell: bash
        run: |
          if [ -f .automation/hardcoding.patch ]; then
            python3 -c 'import base64,gzip,pathlib,sys; sys.stdout.buffer.write(gzip.decompress(base64.b64decode(pathlib.Path(".automation/hardcoding.patch").read_bytes(),validate=True)))' > /tmp/configuracion.patch
            git apply --check /tmp/configuracion.patch
            git apply /tmp/configuracion.patch
            git diff --check
            git rm .automation/hardcoding.patch
            git add apps packages scripts docs .env.example .dev.vars.example
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Corrige configuración fija, calendario, sesiones y alertas'
            git push origin HEAD:refs/heads/fix/configuracion-sin-hardcoding
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Empaqueta el código versionado sin credenciales
        run: git archive --format=tar HEAD -o /tmp/proyecto.tar
      - uses: actions/upload-artifact@v4
        with:
          name: codigo-revision
          path: /tmp/proyecto.tar
          retention-days: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.patch.outputs.applied == 'true'
        with:
          version: 11.1.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.patch.outputs.applied == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Instala dependencias bloqueadas
        if: steps.patch.outputs.applied == 'true'
        run: pnpm install --frozen-lockfile
      - name: Genera paquetes compartidos y Prisma
        if: steps.patch.outputs.applied == 'true'
        run: |
          pnpm --filter @aula/shared build
          pnpm --filter @aula/database exec prisma generate
          pnpm --filter @aula/database build
      - name: Pruebas y compilaciones sin acceso a producción
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          result=0
          pnpm --filter backend test || result=1
          pnpm --filter backend build || result=1
          pnpm --filter frontend test || result=1
          pnpm --filter frontend build || result=1
          pnpm cloudflare:build || result=1
          exit "$result"
